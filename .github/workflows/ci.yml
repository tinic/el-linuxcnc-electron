name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  panel:
    name: Operator panel (type check, lint, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  backend:
    name: Backend (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    # Debian 13 with GCC 16, LinuxCNC 2.9.10 and WebKitGTK: everything is built, the LinuxCNC
    # adapters and the elle executable included.
    container: gcc:16.2.0-trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: dev
          - preset: release
          - preset: tsan
          - preset: analyze
            packages: clang-tidy-19 cppcheck
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: ../.github/scripts/install-trixie-deps.sh ${{ matrix.packages }}
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_CXX_COMPILER=g++ -DCMAKE_MAKE_PROGRAM=ninja -DELLE_REQUIRE_LINUXCNC=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  package:
    name: Package
    uses: ./.github/workflows/package.yml
