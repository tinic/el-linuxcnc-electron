name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Lint, typecheck, build & test (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            elle-app/yarn.lock
            elle-app/elle-frontend/yarn.lock

      - name: Enable yarn
        run: corepack enable

      - name: Install dependencies (electron)
        working-directory: elle-app
        run: yarn install --frozen-lockfile

      - name: Install dependencies (frontend)
        working-directory: elle-app/elle-frontend
        run: yarn install --frozen-lockfile

      - name: Lint
        working-directory: elle-app
        run: yarn lint

      - name: Build electron main process
        working-directory: elle-app
        run: yarn build

      - name: Typecheck & build frontend
        working-directory: elle-app/elle-frontend
        run: yarn build

      - name: Frontend unit tests
        working-directory: elle-app/elle-frontend
        run: yarn test

  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest pydantic

      - name: Run backend test suite
        run: pytest elle-app/elle-hal/tests -v
